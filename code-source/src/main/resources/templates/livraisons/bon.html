<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bon de livraison</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body { background: #eef0f4; }
        .bon { max-width: 210mm; background: #fff; padding: 15mm; margin: 20px auto; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        .bon h1 { font-size: 1.6rem; letter-spacing: .05em; }
        .signature { height: 28mm; border: 1px solid #ccc; border-radius: 6px; }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff !important; }
            .bon { box-shadow: none; margin: 0; padding: 0; max-width: none; }
            @page { size: A4; margin: 15mm; }
        }
    </style>
</head>
<body>

<div class="bon">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <div class="fs-5 fw-bold" th:text="${nomBoutique}">Boutique</div>
            <div class="text-muted">Réception de marchandises</div>
        </div>
        <div class="text-end">
            <h1 class="m-0">BON DE LIVRAISON</h1>
            <div>N° <strong th:text="${livraison.id}">1</strong></div>
            <div th:text="${livraison.dateFormatee}">01/01/2026 10:00</div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-6">
            <div class="text-muted small text-uppercase">Fournisseur</div>
            <div class="fw-semibold" th:text="${livraison.grossiste.nom}">Grossiste</div>
            <div th:if="${livraison.grossiste.telephone != null}" th:text="${livraison.grossiste.telephone}">70 00 00 00</div>
            <div th:if="${livraison.grossiste.adresse != null}" th:text="${livraison.grossiste.adresse}">Adresse</div>
        </div>
        <div class="col-6">
            <div class="text-muted small text-uppercase">Réceptionné par</div>
            <div class="fw-semibold"
                 th:text="${livraison.utilisateur.prenom + ' ' + livraison.utilisateur.nom}">Nom</div>
        </div>
    </div>

    <table class="table table-bordered align-middle">
        <thead class="table-light">
        <tr>
            <th>Désignation</th>
            <th class="text-center">Quantité</th>
            <th class="text-end">Prix unitaire</th>
            <th class="text-end">Montant</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${livraison.lignes}">
            <td th:text="${l.produit.nom}">Produit</td>
            <td class="text-center" th:text="${l.quantite}">10</td>
            <td class="text-end" th:text="${#numbers.formatDecimal(l.prixAchat, 1, 'WHITESPACE', 0, 'POINT')}">800</td>
            <td class="text-end" th:text="${#numbers.formatDecimal(l.sousTotal, 1, 'WHITESPACE', 0, 'POINT')}">8 000</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="text-end">TOTAL (FCFA)</th>
            <th class="text-end fs-6"
                th:text="${#numbers.formatDecimal(livraison.total, 1, 'WHITESPACE', 0, 'POINT')}">8 000</th>
        </tr>
        </tfoot>
    </table>

    <div class="row mt-5">
        <div class="col-6">
            <div class="text-muted small mb-1">Signature du livreur</div>
            <div class="signature"></div>
        </div>
        <div class="col-6">
            <div class="text-muted small mb-1">Signature du réceptionnaire</div>
            <div class="signature"></div>
        </div>
    </div>
</div>

<div class="text-center mb-4 no-print">
    <button type="button" class="btn btn-primary" onclick="window.print()">Imprimer le bon</button>
    <a th:href="@{/livraisons/{id}(id=${livraison.id})}" class="btn btn-outline-secondary">Retour aux détails</a>
    <a th:href="@{/historique}" class="btn btn-outline-secondary">Historique</a>
</div>

</body>
</html>
