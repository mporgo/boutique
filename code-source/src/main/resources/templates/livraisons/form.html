<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouvelle livraison - Boutique</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-4">
    <h3 class="mb-3">Nouvelle livraison d'un grossiste</h3>

    <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

    <form th:action="@{/livraisons}" method="post">

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Grossiste existant</label>
                <select name="grossisteId" class="form-select">
                    <option value="">-- Nouveau grossiste (à saisir ci-contre) --</option>
                    <option th:each="g : ${grossistes}" th:value="${g.id}" th:text="${g.nom}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Nom du nouveau grossiste</label>
                <input type="text" name="nomGrossiste" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Téléphone (facultatif)</label>
                <input type="text" name="telephoneGrossiste" class="form-control">
            </div>
        </div>

        <table class="table align-middle">
            <thead>
            <tr>
                <th>Produit</th>
                <th>Quantité reçue</th>
                <th>Prix d'achat unitaire</th>
                <th class="text-end">Sous-total</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="lignes"></tbody>
            <tfoot>
            <tr>
                <th colspan="3" class="text-end">TOTAL (FCFA)</th>
                <th class="text-end fs-5" id="total">0</th>
                <th></th>
            </tr>
            </tfoot>
        </table>

        <button type="button" class="btn btn-outline-primary" id="btnAjouter">+ Ajouter un produit</button>
        <button type="submit" class="btn btn-success">Enregistrer la livraison</button>
        <a th:href="@{/historique}" class="btn btn-outline-secondary">Annuler</a>
    </form>
</div>

<template id="modeleLigne">
    <tr>
        <td>
            <select name="produitId" class="form-select" required>
                <option value="">-- Choisir un produit --</option>
                <option th:each="p : ${produits}" th:value="${p.id}"
                        th:text="${p.nom + ' (stock : ' + p.stock + ')'}"></option>
            </select>
        </td>
        <td style="width:140px">
            <input type="number" name="quantite" class="form-control" min="1" value="1" required>
        </td>
        <td style="width:180px">
            <input type="number" name="prixAchat" class="form-control" min="0" step="1" required>
        </td>
        <td class="text-end sous">0</td>
        <td class="text-end">
            <button type="button" class="btn btn-sm btn-outline-danger btn-retirer">&times;</button>
        </td>
    </tr>
</template>

<script>
    const corps = document.getElementById('lignes');
    const modele = document.getElementById('modeleLigne');
    const fmt = n => new Intl.NumberFormat('fr-FR').format(n);

    function ajouterLigne() {
        corps.appendChild(modele.content.cloneNode(true));
        recalculer();
    }

    function recalculer() {
        let total = 0;
        corps.querySelectorAll('tr').forEach(tr => {
            const qte = parseInt(tr.querySelector('input[name=quantite]').value) || 0;
            const prix = parseFloat(tr.querySelector('input[name=prixAchat]').value) || 0;
            const sous = qte * prix;
            tr.querySelector('.sous').textContent = fmt(sous);
            total += sous;
        });
        document.getElementById('total').textContent = fmt(total);
    }

    document.getElementById('btnAjouter').addEventListener('click', ajouterLigne);
    corps.addEventListener('input', recalculer);
    corps.addEventListener('click', e => {
        if (e.target.classList.contains('btn-retirer')) {
            e.target.closest('tr').remove();
            recalculer();
        }
    });

    ajouterLigne();
</script>
</body>
</html>
