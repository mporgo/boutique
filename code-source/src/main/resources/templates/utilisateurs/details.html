<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détails de l'utilisateur - Boutique</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-4" style="max-width: 720px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">Détails de l'utilisateur</h3>
        <a th:href="@{/utilisateurs}" class="btn btn-outline-secondary">Retour à la liste</a>
    </div>

    <div class="card">
        <div class="card-body p-4">
            <div class="d-flex align-items-center mb-4">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-3"
                     style="width:56px;height:56px;font-size:1.3rem;font-weight:600;"
                     th:text="${#strings.substring(utilisateur.prenom, 0, 1) + #strings.substring(utilisateur.nom, 0, 1)}">AB</div>
                <div>
                    <div class="fs-5 fw-bold" th:text="${utilisateur.prenom + ' ' + utilisateur.nom}">Prénom Nom</div>
                    <span class="badge" th:classappend="${utilisateur.actif} ? 'bg-success' : 'bg-secondary'"
                          th:text="${utilisateur.actif} ? 'Compte actif' : 'Compte désactivé'">Compte actif</span>
                </div>
            </div>

            <dl class="row mb-0">
                <dt class="col-sm-4 text-muted fw-normal">Numéro matricule</dt>
                <dd class="col-sm-8" th:text="${utilisateur.matricule}">M001</dd>

                <dt class="col-sm-4 text-muted fw-normal">Sexe</dt>
                <dd class="col-sm-8" th:text="${utilisateur.sexe.name() == 'M'} ? 'Masculin' : 'Féminin'">Masculin</dd>

                <dt class="col-sm-4 text-muted fw-normal">Date de naissance</dt>
                <dd class="col-sm-8" th:text="${#temporals.format(utilisateur.dateNaissance, 'dd/MM/yyyy')}">01/01/1990</dd>

                <dt class="col-sm-4 text-muted fw-normal">Identifiant</dt>
                <dd class="col-sm-8" th:text="${utilisateur.identifiant}">admin</dd>

                <dt class="col-sm-4 text-muted fw-normal">Rôle</dt>
                <dd class="col-sm-8" th:text="${utilisateur.role.name() == 'GERANT'} ? 'Gérant' : 'Caissier'">Gérant</dd>
            </dl>
        </div>
    </div>
</div>
</body>
</html>
