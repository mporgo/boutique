spring.application.name=boutique

# --- Base de données (MySQL via XAMPP) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/boutique?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# Le schéma est géré par database/schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# --- Web ---
server.port=8080
spring.thymeleaf.cache=false

boutique.nom=FasoChic